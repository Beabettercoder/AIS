<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>数据管理 · 海事态势</title>
  <style>
    :root{font-family:Inter,"Microsoft YaHei",sans-serif;color:#18303b;background:#f3f7f7;--teal:#08756f;--teal-dark:#075650;--line:#dbe6e6;--muted:#667b83;--danger:#b43d35;--navy:#173f4b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 85% -10%,#d8eeeb 0,transparent 34%),#f3f7f7}
    main{max-width:1220px;margin:auto;padding:26px 24px 76px}a{color:var(--teal);text-decoration:none}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.top nav{display:flex;gap:10px}.nav-link{padding:9px 13px;background:#fff;border:1px solid var(--line);border-radius:10px;font-size:13px;font-weight:650;box-shadow:0 2px 10px #173d4608}
    .hero{position:relative;overflow:hidden;padding:28px 30px;border-radius:22px;background:linear-gradient(125deg,#123f4b,#08756f);color:#fff;box-shadow:0 18px 44px #123f4b24;margin-bottom:18px}.hero:after{content:"";position:absolute;width:260px;height:260px;border:48px solid #ffffff0c;border-radius:50%;right:-85px;top:-125px}.eyebrow{font-size:11px;letter-spacing:.18em;font-weight:750;color:#a7ded7;margin:0 0 7px}.hero h1{font-size:30px;margin:0 0 8px}.hero .lead{margin:0;max-width:790px;color:#d7eeeb;line-height:1.7;font-size:14px}.notice{background:#fff;border:1px solid var(--line);border-left:4px solid #d39a2d;border-radius:13px;padding:12px 16px;color:#536970;margin-bottom:18px;font-size:13px;box-shadow:0 5px 18px #15394309}
    .overview{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}.overview-card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:15px 17px;box-shadow:0 7px 22px #1836400a}.overview-card span{display:block;color:var(--muted);font-size:12px}.overview-card strong{display:block;margin-top:5px;font-size:25px;color:var(--navy)}
    .toolbar{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:10px;margin-bottom:13px;box-shadow:0 7px 22px #1836400a}input,select,button{font:inherit;border-radius:10px;padding:10px 12px}input,select{border:1px solid #cbdadb;background:#fff;min-width:0}input:focus,select:focus{outline:3px solid #8dccbf38;border-color:#6db7ab}button{border:0;background:var(--teal);color:#fff;font-weight:650;cursor:pointer}button:hover:not(:disabled){background:var(--teal-dark)}button:disabled{opacity:.45;cursor:not-allowed}.secondary{background:#e8f3f1;color:#17645f}.secondary:hover:not(:disabled){background:#d9ebe7}.danger{background:var(--danger)}
    .summary{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:0 3px 12px;color:var(--muted);font-size:13px}.source-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.source-card{position:relative;overflow:hidden;background:#fff;border:1px solid var(--line);border-radius:17px;padding:18px;box-shadow:0 8px 26px #1836400b;transition:transform .16s,box-shadow .16s,border-color .16s}.source-card:hover{transform:translateY(-2px);box-shadow:0 14px 34px #18364014;border-color:#b9d5d1}.source-card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--card-accent,#2c8e87)}.source-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.source-identity{display:flex;gap:11px;min-width:0}.source-icon{width:40px;height:40px;display:grid;place-items:center;flex:0 0 40px;border-radius:12px;background:var(--icon-bg,#e7f3f1);color:var(--card-accent,#217b74);font-size:12px;font-weight:800}.name{display:block;font-weight:750;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.sub{display:block;color:var(--muted);font-size:12px;margin-top:4px;line-height:1.45}.kind{display:inline-block;border-radius:99px;padding:4px 9px;background:var(--icon-bg,#e7f3f1);color:var(--card-accent,#17646b);font-size:11px;font-weight:700;white-space:nowrap}.source-metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:15px 0}.metric{background:#f7fafa;border:1px solid #e7eeee;border-radius:10px;padding:9px 10px}.metric span{display:block;color:#809097;font-size:10px}.metric strong{display:block;font-size:13px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.source-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;border-top:1px solid #edf1f1;padding-top:12px}.mono{font:10px/1.5 Consolas,monospace;color:#819198;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.source-foot button{flex:none;padding:7px 11px;font-size:12px}.empty{grid-column:1/-1;padding:55px;text-align:center;color:var(--muted);background:#fff;border:1px dashed #cbdcdd;border-radius:17px}
    /* 数据集折叠分组全新样式 */
    .dataset-group-list{display:flex;flex-direction:column;gap:16px}
    .dataset-group{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 4px 18px #18364009;transition:border-color .2s,box-shadow .2s;overflow:hidden}
    .dataset-group:hover{border-color:#bad6d2;box-shadow:0 8px 26px #18364010}
    .dataset-group-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;cursor:pointer;user-select:none;background:#ffffff;transition:background .15s}
    .dataset-group-header:hover{background:#f7faf9}
    .dataset-group.expanded .dataset-group-header{background:#f1f8f7;border-bottom:1px solid #e1eceb}
    .d-info{display:flex;align-items:center;gap:14px;min-width:0}
    .d-badge-icon{width:44px;height:44px;border-radius:12px;background:#e4f4f1;color:var(--teal);display:grid;place-items:center;font-size:20px;flex:0 0 44px}
    .d-text{min-width:0}
    .d-title-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
    .d-title{font-size:16px;color:var(--navy);font-weight:750}
    .d-count-tag{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;background:#e6f3f1;color:#0d6e67;border-radius:99px}
    .d-rows-tag{display:inline-block;font-size:11px;color:#627b82;background:#f0f4f4;padding:3px 9px;border-radius:99px}
    .d-sub-row{display:flex;align-items:center;gap:14px;margin-top:5px;font-size:12px;color:var(--muted);flex-wrap:wrap}
    .k-chip{display:inline-block;font-size:10px;font-weight:650;padding:1px 7px;background:#edf5f5;color:#26555c;border-radius:6px;margin-right:4px}
    .d-action{display:flex;align-items:center;gap:9px;flex:none}
    .d-status-text{font-size:12px;font-weight:650;color:var(--teal)}
    .d-arrow{display:inline-block;width:26px;height:26px;line-height:26px;text-align:center;background:#edf4f3;color:#17655f;border-radius:50%;font-size:11px;transition:transform .2s ease}
    .dataset-group.expanded .d-arrow{transform:rotate(180deg);background:var(--teal);color:#fff}
    .dataset-group-body{padding:16px 20px 20px;background:#fafcfc}
    .dataset-group.collapsed .dataset-group-body{display:none}
    dialog{border:0;border-radius:20px;padding:0;box-shadow:0 28px 90px #0a202a50;width:min(680px,calc(100vw - 28px));color:inherit}dialog::backdrop{background:#102b3580;backdrop-filter:blur(3px)}.modal{padding:27px}.modal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:15px}.modal h2{margin:0 0 5px;font-size:22px}.close{background:transparent;color:#607681;font-size:22px;padding:0 6px}.close:hover:not(:disabled){background:#edf3f3;color:#334e57}.impact{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:20px 0}.impact div{padding:12px;background:#f4f8f8;border:1px solid #e1eaeb;border-radius:11px}.impact strong{display:block;font-size:20px}.impact span{font-size:12px;color:var(--muted)}.warning{border-left:4px solid #d18a1a;background:#fff8ea;padding:12px 14px;border-radius:99px;font-size:13px;line-height:1.55}.confirm-label{display:block;font-weight:700;font-size:13px;margin:20px 0 7px}.confirm-id{font:12px Consolas,monospace;color:#4e6872;display:block;margin:6px 0}.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}.status{min-height:20px;margin:9px 0;color:#315f66;font-size:13px}.status.error{color:var(--danger)}
    @keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
    .spinner{display:inline-block;width:12px;height:12px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .75s linear infinite;vertical-align:middle;margin-right:6px}
    .spinner.dark{border-color:rgba(8,117,111,.2);border-top-color:var(--teal)}
    .live-badge{display:inline-flex;align-items:center;gap:7px;background:#e7f5f3;color:#0b6660;font-weight:650;font-size:12px;padding:5px 12px;border-radius:99px;border:1px solid #c2e2dd}
    .pulse-dot{width:8px;height:8px;border-radius:50%;background:#10b981;animation:pulse 1.2s infinite ease-in-out;flex-shrink:0}
    .progress-box{margin:16px 0;background:#f2f9f8;border:1px solid #cfdedd;border-radius:14px;padding:16px;box-shadow:inset 0 1px 4px #00000005}
    .progress-box .p-title{font-size:13px;font-weight:750;color:#123f4b;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
    .progress-box .p-timer{font-family:Consolas,monospace;color:#0a726b;font-weight:700;background:#e2f0ee;padding:2px 7px;border-radius:6px;font-size:12px}
    .progress-box .p-bar-bg{width:100%;height:6px;background:#d7e7e5;border-radius:99px;overflow:hidden;margin:8px 0}
    .progress-box .p-bar-fill{height:100%;background:linear-gradient(90deg,#08756f,#1bb3aa);width:45%;border-radius:99px;transition:width .4s ease}
    .progress-box .p-log{font-size:12px;color:#4a656d;margin-top:8px;line-height:1.6;font-family:Consolas,monospace}
    .source-card.inspecting{border-color:#1bb3aa;box-shadow:0 0 0 2px #1bb3aa33;background:#fafefe}
    @media(max-width:820px){.overview{grid-template-columns:1fr 1fr}.toolbar{grid-template-columns:1fr 1fr}.source-grid{grid-template-columns:1fr}.impact{grid-template-columns:1fr 1fr}}
    @media(max-width:560px){main{padding:16px 12px 55px}.top{align-items:flex-start}.top nav{flex-direction:column}.hero{padding:24px 20px}.hero h1{font-size:25px}.toolbar{grid-template-columns:1fr}.overview{grid-template-columns:1fr 1fr}.source-metrics{grid-template-columns:1fr}.impact{grid-template-columns:1fr}}
  </style>
</head>
<body>
<main>
  <div class="top"><a href="/">← 返回对话</a><nav><a class="nav-link" href="/data-intake">＋ 接入新数据</a><a class="nav-link" href="/situation-cube">态势数据立方体</a></nav></div>
  <section class="hero"><p class="eyebrow">MARITIME DATA CATALOG</p><h1>已接入数据管理</h1><p class="lead">统一查看 AIS、GIS、气象、遥感与事件来源。每一张卡片代表一次独立接入，可追踪、可核验，也可单独清理。</p></section>
  <div class="notice">基础数据集受保护。删除前系统会先计算影响范围；必须输入完整来源 ID 才能执行。遥感和事件原文件会移入可恢复目录。</div>
  <section class="overview" aria-label="数据来源概览"><div class="overview-card"><span>已接入来源</span><strong id="stat-source-count">—</strong></div><div class="overview-card"><span>记录 / 要素</span><strong id="stat-record-count">—</strong></div><div class="overview-card"><span>研究区域</span><strong id="stat-region-count">—</strong></div><div class="overview-card"><span>数据类型</span><strong id="stat-kind-count">—</strong></div></section>
  <section class="toolbar" aria-label="筛选数据来源">
    <input id="search" type="search" placeholder="搜索文件名、区域或来源 ID">
    <select id="kind"><option value="">全部类型</option><option value="ais_csv">AIS</option><option value="gis_geojson">GIS</option><option value="noaa_enc_channels">GIS · NOAA ENC</option><option value="weather_csv">气象</option><option value="remote_geotiff">遥感影像</option><option value="stac_json">遥感目录</option><option value="event_text">事件文本</option></select>
    <input id="region" placeholder="筛选研究区域">
    <button id="refresh" type="button">刷新</button>
  </section>
  <div id="status" class="status" role="status"></div>
  <div class="summary">
    <div>
      <span id="summary">正在读取…</span>
      <span style="margin-left:10px;color:#80959c">按所属数据集 / 研究区域归类</span>
    </div>
    <div style="display:flex;gap:8px;align-items:center">
      <button id="btn-expand-all" class="secondary" type="button" style="padding:5px 12px;font-size:12px">全部展开</button>
      <button id="btn-collapse-all" class="secondary" type="button" style="padding:5px 12px;font-size:12px">全部折叠</button>
    </div>
  </div>
  <section id="source-table" class="dataset-group-list"><div class="empty">正在读取数据来源…</div></section>
  <div style="display:none" class="source-grid"></div>
</main>
<dialog id="delete-dialog">
  <div class="modal">
    <div class="modal-head"><div><h2>删除这一份数据来源</h2><div id="target-name" class="sub"></div></div><button class="close" id="close-dialog" type="button" aria-label="关闭">×</button></div>
    <div id="impact" class="impact"></div>
    <div class="warning">此操作会删除该来源的数据库记录，并清理它生成的融合节点、关系和态势证据。若事件被其他来源共同证明，该事件会保留。</div>
    <label class="confirm-label" for="confirmation">输入下方完整来源 ID 确认：</label>
    <code id="confirmation-id" class="confirm-id"></code>
    <input id="confirmation" autocomplete="off" placeholder="粘贴完整来源 ID">
    <div id="delete-status" class="status" role="status"></div>
    <div class="modal-actions"><button id="cancel-delete" class="secondary" type="button">取消</button><button id="confirm-delete" class="danger" type="button" disabled>确认删除这一来源</button></div>
  </div>
</dialog>
<script src="/assets/data-management.js?v=2.8.0"></script>
</body>
</html>
